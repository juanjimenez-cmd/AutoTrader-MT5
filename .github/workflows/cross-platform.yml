name: Cross-platform tests

on:
  push:
    branches: [main, feature/autotrader-mt5-v1]
  pull_request:

jobs:
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python-version: ["3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install platform dependencies
        run: python -m pip install ".[platform]"
      - name: Verify installed command module
        run: python -c "import autotrader_mt5; print(autotrader_mt5.__version__)"
      - name: Run AutoTrader tests
        run: python -m unittest discover -s tests_autotrader -v
